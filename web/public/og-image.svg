<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0D9488"/>
      <stop offset="100%" style="stop-color:#14B8A6"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Decorative grid lines -->
  <g opacity="0.05" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  
  <!-- Accent bar at top -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
  
  <!-- Chart visualization (decorative) -->
  <g transform="translate(700, 180)">
    <!-- Bar chart -->
    <rect x="0" y="80" width="40" height="120" rx="4" fill="#0D9488" opacity="0.6"/>
    <rect x="60" y="40" width="40" height="160" rx="4" fill="#0D9488" opacity="0.7"/>
    <rect x="120" y="60" width="40" height="140" rx="4" fill="#0D9488" opacity="0.8"/>
    <rect x="180" y="20" width="40" height="180" rx="4" fill="#0D9488" opacity="0.9"/>
    <rect x="240" y="0" width="40" height="200" rx="4" fill="#14B8A6"/>
    <rect x="300" y="50" width="40" height="150" rx="4" fill="#0D9488" opacity="0.7"/>
    <rect x="360" y="30" width="40" height="170" rx="4" fill="#0D9488" opacity="0.8"/>
    
    <!-- Trend line -->
    <polyline points="20,90 80,50 140,65 200,30 260,10 320,55 380,35" 
              fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Dots on trend line -->
    <circle cx="20" cy="90" r="4" fill="#F59E0B"/>
    <circle cx="80" cy="50" r="4" fill="#F59E0B"/>
    <circle cx="140" cy="65" r="4" fill="#F59E0B"/>
    <circle cx="200" cy="30" r="4" fill="#F59E0B"/>
    <circle cx="260" cy="10" r="5" fill="#F59E0B"/>
    <circle cx="320" cy="55" r="4" fill="#F59E0B"/>
    <circle cx="380" cy="35" r="4" fill="#F59E0B"/>
  </g>
  
  <!-- Logo/Icon -->
  <g transform="translate(80, 160)">
    <rect width="48" height="48" rx="10" fill="url(#accent)"/>
    <text x="24" y="34" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="white">$</text>
  </g>
  
  <!-- Title -->
  <text x="80" y="270" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="700" fill="white">
    OpenFinance
  </text>
  
  <!-- Subtitle -->
  <text x="80" y="330" font-family="Inter, system-ui, sans-serif" font-size="28" fill="#94A3B8">
    Self-hosted personal finance management
  </text>
  
  <!-- Features -->
  <g transform="translate(80, 390)" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#64748B">
    <g>
      <circle cx="6" cy="-5" r="6" fill="#0D9488"/>
      <text x="20" y="0">Budgets &amp; Goals</text>
    </g>
    <g transform="translate(200, 0)">
      <circle cx="6" cy="-5" r="6" fill="#0D9488"/>
      <text x="20" y="0">Investment Tracking</text>
    </g>
    <g transform="translate(430, 0)">
      <circle cx="6" cy="-5" r="6" fill="#0D9488"/>
      <text x="20" y="0">Rich Reports</text>
    </g>
  </g>
  
  <!-- Privacy badge -->
  <g transform="translate(80, 450)">
    <rect width="200" height="36" rx="18" fill="#0D9488" opacity="0.15"/>
    <text x="100" y="24" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#14B8A6">
      🔒 Privacy-First • Open Source
    </text>
  </g>
  
  <!-- URL -->
  <text x="80" y="560" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#475569">
    openfinance.dev
  </text>
</svg>
