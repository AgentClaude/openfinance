services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: openfinance_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openfinance_production}
      POSTGRES_USER: ${POSTGRES_USER:-openfinance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openfinance} -d ${POSTGRES_DB:-openfinance_production}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache & Job Queue
  redis:
    image: redis:7-alpine
    container_name: openfinance_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Rails API Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: openfinance_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - RAILS_ENV=${RAILS_ENV:-production}
      - DATABASE_URL=${DATABASE_URL:-postgres://openfinance:password@db:5432/openfinance_production}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENABLE_PLAID=${ENABLE_PLAID:-true}
      - PLAID_CLIENT_ID=${PLAID_CLIENT_ID}
      - PLAID_SECRET=${PLAID_SECRET}
      - PLAID_ENVIRONMENT=${PLAID_ENVIRONMENT:-sandbox}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3002}
      - DB_HOST=db
      - DB_USERNAME=openfinance
      - DB_PASSWORD=password
      - DB_NAME=openfinance_development
      - DB_TEST_NAME=openfinance_test
      - SMTP_ADDRESS=${SMTP_ADDRESS}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - FROM_EMAIL=${FROM_EMAIL}
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - rails_storage:/app/storage
      - rails_logs:/app/log
      - ./api:/app
    command: >
      sh -c "
        rm -f /app/tmp/pids/server.pid &&
        echo 'Waiting for database...' &&
        bundle exec rails db:prepare &&
        echo 'Database ready, starting server...' &&
        bundle exec rails server -b 0.0.0.0 -p 3001
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Sidekiq Background Jobs
  sidekiq:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: openfinance_sidekiq
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      - RAILS_ENV=${RAILS_ENV:-production}
      - DATABASE_URL=${DATABASE_URL:-postgres://openfinance:password@db:5432/openfinance_production}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SIDEKIQ_REDIS_URL=${SIDEKIQ_REDIS_URL:-redis://redis:6379/1}
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - ENABLE_PLAID=${ENABLE_PLAID:-true}
      - PLAID_CLIENT_ID=${PLAID_CLIENT_ID}
      - PLAID_SECRET=${PLAID_SECRET}
      - PLAID_ENVIRONMENT=${PLAID_ENVIRONMENT:-sandbox}
    volumes:
      - rails_storage:/app/storage
      - rails_logs:/app/log
    command: bundle exec sidekiq
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f sidekiq || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Frontend
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: openfinance_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - VITE_API_URL=${API_URL:-http://localhost:3001}
      - VITE_GRAPHQL_URL=/graphql
      - VITE_PLAID_ENVIRONMENT=${PLAID_ENVIRONMENT:-sandbox}
    ports:
      - "${WEB_PORT:-3002}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rails_storage:
    driver: local
  rails_logs:
    driver: local

networks:
  default:
    name: openfinance_network