# Active Storage configuration for OpenFinance
# Supports local storage and S3-compatible services

test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

development:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Amazon S3 service (production default)
amazon:
  service: S3
  access_key_id: <%= Rails.application.credentials.dig(:aws, :access_key_id) || ENV['AWS_ACCESS_KEY_ID'] %>
  secret_access_key: <%= Rails.application.credentials.dig(:aws, :secret_access_key) || ENV['AWS_SECRET_ACCESS_KEY'] %>
  region: <%= ENV['AWS_REGION'] %>
  bucket: <%= ENV['AWS_BUCKET'] %>
  public: false
  
# Google Cloud Storage service
google:
  service: GCS
  project: <%= ENV['GCS_PROJECT'] %>
  credentials: <%= Rails.application.credentials.dig(:gcs, :keyfile) || ENV['GCS_KEYFILE'] %>
  bucket: <%= ENV['GCS_BUCKET'] %>
  public: false

# Microsoft Azure Storage service
microsoft:
  service: AzureStorage
  storage_account_name: <%= ENV['AZURE_STORAGE_ACCOUNT'] %>
  storage_access_key: <%= ENV['AZURE_STORAGE_ACCESS_KEY'] %>
  container: <%= ENV['AZURE_CONTAINER'] %>
  public: false

# MinIO (self-hosted S3-compatible)
minio:
  service: S3
  access_key_id: <%= ENV['MINIO_ACCESS_KEY'] %>
  secret_access_key: <%= ENV['MINIO_SECRET_KEY'] %>
  region: us-east-1
  bucket: <%= ENV['MINIO_BUCKET'] %>
  endpoint: <%= ENV['MINIO_ENDPOINT'] %>
  force_path_style: true
  public: false

production:
  # Use environment variable to determine storage service
  service: <%= ENV.fetch('STORAGE_SERVICE', 'amazon') %>
  
  # S3-compatible configuration (default)
  access_key_id: <%= ENV['AWS_ACCESS_KEY_ID'] %>
  secret_access_key: <%= ENV['AWS_SECRET_ACCESS_KEY'] %>
  region: <%= ENV.fetch('AWS_REGION', 'us-east-1') %>
  bucket: <%= ENV['AWS_BUCKET'] %>
  endpoint: <%= ENV['S3_ENDPOINT'] %> # For S3-compatible services like MinIO
  force_path_style: <%= ENV.fetch('S3_FORCE_PATH_STYLE', 'false') == 'true' %>
  public: false