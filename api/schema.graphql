# ─── Query Type ──────────────────────────────────────────────────────────────

type Query {
  me: User
  myReferralCode: String
  referrals: [Referral!]!
  householdMembers: [HouseholdMember!]!
  householdInvitations: [Invitation!]!

  goals(activeOnly: Boolean = false): [Goal!]!

  accounts: [Account!]!

  transactions(
    search: String
    categoryId: String
    accountId: String
    minAmount: Float
    maxAmount: Float
    dateFrom: String
    dateTo: String
    needsReview: Boolean
    page: Int = 1
    limit: Int = 50
  ): TransactionPage!

  categories: [Category!]!
  tags: [Tag!]!

  dashboardSummary: DashboardSummary!

  holdings(accountId: ID): [Holding!]!
  portfolioSummary(accountId: ID): PortfolioSummary!

  notifications(unreadOnly: Boolean = false, limit: Int = 50): [Notification!]!
  unreadNotificationCount: Int!
  notificationPreferences: [NotificationPreference!]!

  apiKeys: [ApiKey!]!
  shareTokens: [ShareToken!]!
  balanceAdjustments(accountId: ID!): [BalanceAdjustment!]!
  categorizationRules: [CategorizationRule!]!

  recurringItems(activeOnly: Boolean = false): [RecurringItem!]!

  budget(month: String!): [BudgetItem!]!
  budgetSummary(month: String!): BudgetSummary

  reports(months: Int = 6, dateFrom: String, dateTo: String): Reports!
}

# ─── Mutation Type ───────────────────────────────────────────────────────────

type Mutation {
  # Auth
  login(email: String!, password: String!): LoginPayload!
  register(name: String!, email: String!, password: String!, referralCode: String): RegisterPayload!

  # Accounts
  createManualAccount(input: ManualAccountInput!): CreateManualAccountPayload!
  deleteAccount(password: String!): DeleteAccountPayload!
  adjustBalance(accountId: ID!, amount: Float!, adjustedAt: String, notes: String): AdjustBalancePayload!

  # Transactions
  createTransaction(input: TransactionInput!): Transaction
  updateTransaction(id: ID!, input: TransactionInput!): Transaction
  bulkCategorize(transactionIds: [ID!]!, categoryId: ID!): [Transaction!]
  bulkTransactionAction(transactionIds: [ID!]!, action: String!, categoryId: ID): BulkTransactionActionPayload!
  splitTransaction(transactionId: ID!, splits: [SplitInput!]!): SplitTransactionPayload!
  importCsv(accountId: ID!, csvContent: String!, filename: String = "import.csv", columnMapping: JSON, formatType: String = "auto"): ImportCsvPayload!
  uploadReceipt(transactionId: ID!, fileData: String!, filename: String!, contentType: String = "application/octet-stream"): UploadReceiptPayload!
  uploadStatement(accountId: ID!, fileData: String!, filename: String!, contentType: String = "application/octet-stream"): UploadStatementPayload!

  # Categories
  createCategory(input: CategoryInput!): Category
  updateCategory(id: ID!, input: CategoryInput!): Category
  deleteCategory(id: ID!): Boolean

  # Tags
  createTag(input: TagInput!): Tag
  updateTag(id: ID!, name: String, colorHex: String, isActive: Boolean): Tag
  deleteTag(id: ID!): DeleteTagPayload!

  # Budget
  updateBudgetItem(categoryId: ID!, month: String!, budgeted: Float!): BudgetItem
  deleteBudgetItem(categoryId: ID!, month: String!): DeleteBudgetItemPayload!
  copyBudgetFromMonth(sourceMonth: String!, targetMonth: String!): CopyBudgetFromMonthPayload!
  fillBudgetFromAverages(month: String!): FillBudgetFromAveragesPayload!

  # Plaid
  createPlaidLinkToken: PlaidLinkToken!
  exchangePlaidToken(publicToken: String!, metadata: JSON): [Account!]

  # Categorization rules
  createCategorizationRule(matchField: String!, matchType: String!, matchValue: String!, categoryId: ID!, renameTo: String, priority: Int): CategorizationRule
  updateCategorizationRule(id: ID!, matchField: String, matchType: String, matchValue: String, categoryId: ID, renameTo: String, priority: Int, isActive: Boolean): CategorizationRule
  deleteCategorizationRule(id: ID!): DeleteCategorizationRulePayload!
  applyCategorizationRules: ApplyCategorizationRulesPayload!

  # Recurring items
  detectRecurringTransactions: DetectRecurringTransactionsPayload!
  createRecurringItem(name: String!, amount: Float!, frequency: String!, merchantName: String, description: String, nextOccurrence: ISO8601Date, categoryId: ID, accountId: ID, isIncome: Boolean): RecurringItem
  updateRecurringItem(id: ID!, name: String, amount: Float, frequency: String, merchantName: String, description: String, nextOccurrence: ISO8601Date, categoryId: ID, accountId: ID, isIncome: Boolean, isActive: Boolean): RecurringItem
  deleteRecurringItem(id: ID!): DeleteRecurringItemPayload!
  markRecurringItemPaid(id: ID!, transactionId: ID): RecurringItem

  # Goals
  createGoal(name: String!, targetAmount: Float!, goalType: String = "savings", currentAmount: Float = 0, targetDate: String, description: String, icon: String, color: String): Goal
  updateGoal(id: ID!, name: String, targetAmount: Float, currentAmount: Float, goalType: String, targetDate: String, description: String, icon: String, color: String, isActive: Boolean): Goal
  deleteGoal(id: ID!): DeleteGoalPayload!

  # Profile & Household
  updateProfile(name: String, email: String, currency: String): User
  changePassword(currentPassword: String!, newPassword: String!): ChangePasswordPayload!
  updateHousehold(name: String, currency: String): UpdateHouseholdPayload!

  # Household members
  inviteToHousehold(input: InviteToHouseholdInput!): InviteToHouseholdPayload!
  acceptInvitation(input: AcceptInvitationInput!): AcceptInvitationPayload!
  removeHouseholdMember(input: RemoveHouseholdMemberInput!): RemoveHouseholdMemberPayload!
  updateMemberRole(input: UpdateMemberRoleInput!): UpdateMemberRolePayload!

  # Transfers
  detectTransfers: DetectTransfersPayload!
  linkTransfer(transactionAId: ID!, transactionBId: ID!): LinkTransferPayload!

  # Notifications
  updateNotificationPreference(notificationType: String!, channel: String!, enabled: Boolean!): UpdateNotificationPreferencePayload!
  markNotificationRead(id: ID!, read: Boolean = true): MarkNotificationReadPayload!
  markAllNotificationsRead: MarkAllNotificationsReadPayload!

  # Sharing
  shareAccount(accountId: ID!, email: String!, permissionLevel: String = "view"): ShareAccountPayload!
  createShareToken(input: CreateShareTokenInput!): CreateShareTokenPayload!
  revokeShareToken(input: RevokeShareTokenInput!): RevokeShareTokenPayload!

  # API Keys
  createApiKey(input: CreateApiKeyInput!): CreateApiKeyPayload!
  revokeApiKey(input: RevokeApiKeyInput!): RevokeApiKeyPayload!

  # Merchant mappings
  createMerchantMapping(rawPattern: String!, cleanName: String!, matchType: String): MerchantMapping
  deleteMerchantMapping(id: ID!): DeleteMerchantMappingPayload!

  # Referrals
  redeemReferral(referralCode: String!): RedeemReferralPayload!

  # Data export
  exportData: ExportDataPayload!
}

