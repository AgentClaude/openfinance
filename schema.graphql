type Household {
  currency: String!
  id: ID!
  name: String!
}

"""
An ISO 8601-encoded date
"""
scalar ISO8601Date @specifiedBy(url: "https://tools.ietf.org/html/rfc3339")

"""
An ISO 8601-encoded datetime
"""
scalar ISO8601DateTime @specifiedBy(url: "https://tools.ietf.org/html/rfc3339")

"""
Autogenerated return type of LoginMutation.
"""
type LoginMutationPayload {
  errors: [String!]!
  token: String
  user: User
}

input ManualAccountInput {
  balance: Float!
  currency: String = "USD"
  name: String!
  subtype: String
  type: String!
}

type Mutation {
  bulkCategorize(categoryId: ID!, transactionIds: [ID!]!): [Transaction!]
  createCategory(input: CategoryInput!): Category
  createManualAccount(input: ManualAccountInput!): CreateManualAccountPayload
  createPlaidLinkToken: PlaidLinkToken!
  createTag(input: TagInput!): Tag
  createTransaction(input: TransactionInput!): Transaction
  deleteCategory(id: ID!): Boolean
  exchangePlaidToken(publicToken: String!): [Account!]!
  login(email: String!, password: String!): LoginMutationPayload
  register(email: String!, name: String!, password: String!): RegisterMutationPayload
  updateBudgetItem(budgeted: Float!, categoryId: ID!, month: String!): BudgetItem
  updateCategory(id: ID!, input: CategoryInput!): Category
  updateTransaction(id: ID!, input: TransactionInput!): Transaction
}

type PlaidLinkToken {
  expiration: String!
  linkToken: String!
}

type Query {
  accounts: [Account!]!
  budget(month: String!): [BudgetItem!]!
  categories: [Category!]!
  dashboardSummary: DashboardSummary!
  me: User
  tags: [Tag!]!
  transactions(accountId: String, categoryId: String, dateFrom: String, dateTo: String, limit: Int = 50, maxAmount: Float, minAmount: Float, needsReview: Boolean, page: Int = 1, search: String): TransactionPage!
}

"""
Autogenerated return type of RegisterMutation.
"""
type RegisterMutationPayload {
  errors: [String!]!
  token: String
  user: User
}

type Tag {
  color: String
  householdId: ID!
  id: ID!
  name: String!
}

input TagInput {
  color: String
  name: String!
}

type Transaction {
  account: Account!
  accountId: ID!
  amount: Float!
  category: Category
  categoryId: ID
  date: ISO8601Date!
  description: String!
  id: ID!
  merchantName: String
  needsReview: Boolean!
  pending: Boolean!
  plaidTransactionId: String
  subcategory: Category
  subcategoryId: ID
  tags: [Tag!]!
}

input TransactionInput {
  accountId: ID!
  amount: Float!
  categoryId: ID
  date: String!
  description: String!
  merchantName: String
  needsReview: Boolean = false
  notes: String
  pending: Boolean = false
}

type TransactionPage {
  hasMore: Boolean!
  totalCount: Int!
  transactions: [Transaction!]!
}

type User {
  createdAt: ISO8601DateTime!
  email: String!
  household: Household
  householdId: ID
  id: ID!
  name: String!
  role: String!
}
