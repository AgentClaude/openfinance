type Account {
  balance: Float!
  balanceDate: String
  createdAt: ISO8601DateTime!
  currency: String!
  householdId: ID!
  id: ID!
  isActive: Boolean!
  mask: String
  name: String!
  officialName: String
  plaidAccountId: String
  subtype: String
  type: String!
}

type AccountBalance {
  accountId: ID!
  accountName: String!
  accountType: String!
  balance: Float!
}

type BudgetItem {
  budgeted: Float!
  category: Category
  categoryId: ID!
  id: ID!
  month: String!
  spent: Float!
}

type Category {
  children: [Category!]!
  color: String
  groupName: String
  householdId: ID
  icon: String
  id: ID!
  isSystem: Boolean!
  name: String!
  parentId: ID
}

input CategoryInput {
  color: String
  groupName: String
  icon: String
  name: String!
  parentId: ID
}

type CategorySpending {
  amount: Float!
  categoryId: ID
  categoryName: String!
  color: String
  percentage: Float
}

"""
Autogenerated return type of CreateManualAccount.
"""
type CreateManualAccountPayload {
  balance: Float
  balanceDate: String
  errors: [String!]!
  householdId: ID
  id: ID
  isActive: Boolean
  name: String
  subtype: String
  type: String
}

type DashboardSummary {
  accountBalances: [AccountBalance!]!
  cashFlow: Float!
  monthlyExpenses: Float!
  monthlyIncome: Float!
  needsReviewCount: Int!
  netWorth: Float!
  netWorthChange: Float!
  recentTransactions: [Transaction!]!
  spendingByCategory: [CategorySpending!]!
