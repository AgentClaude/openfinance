name: PR Review Notification

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  notify-review:
    runs-on: ubuntu-latest
    steps:
      - name: Notify OpenClaw for review
        run: |
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"PR #${{ github.event.pull_request.number }} needs review: ${{ github.event.pull_request.title }} by ${{ github.event.pull_request.user.login }}. Action: ${{ github.event.action }}\"}" \
            "${{ secrets.OPENCLAW_WEBHOOK_URL }}" || echo "Webhook not configured yet"
