name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-test:
    name: Rails API — Build & Specs
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: openfinance_test
          POSTGRES_USER: openfinance
          POSTGRES_PASSWORD: password
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openfinance -d openfinance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: api

    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: openfinance
      DB_PASSWORD: password
      DB_TEST_NAME: openfinance_test
      REDIS_URL: redis://localhost:6379/1
      BUNDLE_WITHOUT: development

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: api

      - name: Setup database
        run: |
          mkdir -p log tmp
          bundle exec rails db:create db:schema:load

      - name: Run RSpec
        run: |
          bundle exec rspec --format progress --no-color

  web-build:
    name: React Frontend — Build & Typecheck
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  web-e2e:
    name: React Frontend — E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [api-test, web-build]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: openfinance_production
          POSTGRES_USER: openfinance
          POSTGRES_PASSWORD: password
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openfinance -d openfinance_production"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      RAILS_ENV: production
      DATABASE_URL: postgresql://openfinance:password@localhost:5432/openfinance_production
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY_BASE: ci-test-secret-key-base-not-real
      FORCE_SSL: "false"
      CORS_ORIGINS: http://localhost:3002
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
      VITE_API_URL: http://localhost:3001
      VITE_GRAPHQL_URL: http://localhost:3001/graphql
      BUNDLE_WITHOUT: development

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: api

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Setup API database & seed
        working-directory: api
        run: |
          bundle exec rails db:create db:schema:load db:seed

      - name: Start API server
        working-directory: api
        run: |
          bundle exec rails server -p 3001 -d
          # Wait for API to be ready
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/graphql -X POST -H 'Content-Type: application/json' -d '{"query":"{ __typename }"}' && break
            echo "Waiting for API... ($i)"
            sleep 2
          done

      - name: Install frontend deps & build
        working-directory: web
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Serve frontend
        working-directory: web
        run: |
          npx serve -s dist -l 3002 &
          sleep 3

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: web
        timeout-minutes: 12
        env:
          CI: true
        run: npx playwright test --reporter=list
